<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bone Banner 🇪🇸</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #FFF6EC;
    --card: #FFFFFF;
    --primary: #D62828;
    --primary-dark: #A81E1E;
    --secondary: #2A9D8F;
    --accent: #F7B32B;
    --warn: #E76F51;
    --text: #2B1B12;
    --text-light: #6B5B4E;
    --border: #F1DFC8;
    --radius: 24px;
    --shadow: 0 8px 40px rgba(214,40,40,0.12);
    --font: 'Nunito', sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
  }

  #root { width: 100%; max-width: 600px; }

  .app {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    padding: 22px 24px 20px;
    text-align: center;
    color: white;
    flex-shrink: 0;
  }
  .header h1 { font-size: 1.7rem; font-weight: 900; line-height: 1.2; }
  .header .subtitle { font-size: 0.95rem; color: rgba(255,255,255,0.88); margin-top: 4px; }

  .chat-header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    color: white; flex-shrink: 0;
  }
  .back-btn {
    background: rgba(255,255,255,0.2); border: none; color: white;
    width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }
  .back-btn:hover { background: rgba(255,255,255,0.32); }
  .chat-header-avatar { font-size: 2rem; }
  .chat-header-name { font-size: 1.15rem; font-weight: 900; }
  .chat-header-meta { font-size: 0.8rem; color: rgba(255,255,255,0.85); }

  .main { padding: 20px 20px 28px; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-badge {
    background: #FFF1E0; border: 2px solid var(--border);
    border-radius: 16px; padding: 12px 8px; text-align: center;
  }
  .stat-emoji { font-size: 1.4rem; }
  .stat-value { font-size: 1.15rem; font-weight: 900; color: var(--primary); }
  .stat-label { font-size: 0.72rem; color: var(--text-light); font-weight: 700; }

  .daily-goal { margin-bottom: 22px; }
  .daily-goal-label { font-size: 0.85rem; font-weight: 700; color: var(--text-light); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .daily-goal-bar { height: 12px; background: #F1DFC8; border-radius: 99px; overflow: hidden; }
  .daily-goal-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary)); border-radius: 99px; transition: width 0.4s; }

  .section-label {
    font-size: 0.82rem; font-weight: 700; color: var(--primary);
    text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
  }

  /* SETUP BANNER */
  .setup-banner {
    background: #FFF1E0; border: 2px dashed var(--accent);
    border-radius: 16px; padding: 14px 16px; margin-bottom: 18px;
    font-size: 0.9rem; font-weight: 700; color: var(--text-light);
  }
  .link-btn {
    background: none; border: none; color: var(--primary); font-weight: 800;
    font-size: 0.9rem; cursor: pointer; text-decoration: underline; padding: 0;
  }

  /* CHARACTER GRID */
  .character-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 18px; }
  .character-card {
    background: var(--card); border: 3px solid var(--border);
    border-radius: 20px; padding: 16px; cursor: pointer; text-align: left;
    font-family: var(--font); transition: all 0.2s;
    display: flex; align-items: center; gap: 14px; min-height: 80px;
  }
  .character-card:hover, .character-card:focus {
    border-color: var(--primary); background: #FFF1E0;
    outline: none; transform: scale(1.02);
    box-shadow: 0 4px 18px rgba(214,40,40,0.15);
  }
  .character-card:active { transform: scale(0.98); }
  .character-avatar-wrap { position: relative; flex-shrink: 0; }
  .character-avatar { font-size: 2.6rem; line-height: 1; }
  .character-flag { position: absolute; bottom: -4px; right: -6px; font-size: 1.15rem; }
  .character-name { font-size: 1.15rem; font-weight: 900; color: var(--text); }
  .character-topic { font-size: 0.9rem; color: var(--text-light); margin-top: 1px; }
  .character-level {
    display: inline-block; margin-top: 6px; font-size: 0.72rem; font-weight: 700;
    background: #E9F6F4; color: var(--secondary); border-radius: 99px; padding: 3px 10px;
  }

  /* BUTTONS */
  .btn {
    width: 100%; padding: 16px;
    font-family: var(--font); font-size: 1.05rem; font-weight: 900;
    border: none; border-radius: 18px; cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 56px;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary { background: var(--secondary); color: white; }
  .btn-secondary:hover { background: #228074; }
  .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
  .btn-danger-outline { background: transparent; color: var(--warn); border: 2px solid var(--warn); }
  .btn-block { margin-top: 10px; }

  /* API KEY SCREEN */
  .apikey-input {
    width: 100%; border: 2px solid var(--border); border-radius: 14px;
    padding: 14px; font-family: var(--font); font-size: 1rem; margin-bottom: 14px;
  }
  .apikey-input:focus { outline: none; border-color: var(--primary); }
  .apikey-help { font-size: 0.85rem; color: var(--text-light); margin-bottom: 18px; line-height: 1.5; }
  .apikey-help a { color: var(--primary); font-weight: 700; }
  .apikey-saved { font-size: 0.85rem; color: var(--secondary); font-weight: 700; margin-bottom: 14px; }

  /* CHAT */
  .chat-window {
    flex: 1; overflow-y: auto; padding: 18px 16px 8px;
    display: flex; flex-direction: column; gap: 12px;
    background: #FFFBF5;
  }
  .msg-row { display: flex; gap: 8px; max-width: 88%; }
  .msg-row.ai { align-self: flex-start; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { font-size: 1.6rem; flex-shrink: 0; margin-top: 2px; }
  .msg-bubble {
    border-radius: 18px; padding: 12px 15px; font-size: 1.02rem; font-weight: 700;
    line-height: 1.4; cursor: default;
  }
  .msg-row.ai .msg-bubble { background: white; border: 2px solid var(--border); border-bottom-left-radius: 4px; cursor: pointer; }
  .msg-row.user .msg-bubble { background: var(--primary); color: white; border-bottom-right-radius: 4px; }
  .msg-translation { font-size: 0.85rem; font-weight: 600; color: var(--text-light); margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; }
  .msg-hint { font-size: 0.72rem; color: var(--text-light); font-weight: 600; margin-top: 4px; text-align: center; }
  .msg-tip-flag { font-size: 0.75rem; color: var(--warn); font-weight: 700; margin-top: 3px; }

  .typing-bubble { display: flex; gap: 4px; padding: 14px 16px; }
  .typing-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-light); animation: bounce 1.2s infinite; }
  .typing-dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }

  /* VOCAB SUGGESTIONS */
  .vocab-suggestions { padding: 4px 16px 10px; display: flex; flex-wrap: wrap; gap: 8px; }
  .vocab-chip {
    display: flex; align-items: center; gap: 8px;
    background: #E9F6F4; border: 2px solid var(--secondary);
    border-radius: 14px; padding: 7px 8px 7px 12px;
  }
  .vocab-chip-text { font-size: 0.85rem; }
  .vocab-chip-word { font-weight: 900; color: var(--secondary); }
  .vocab-chip-trans { color: var(--text-light); font-weight: 600; }
  .vocab-chip-add {
    background: var(--secondary); color: white; border: none;
    width: 26px; height: 26px; border-radius: 50%; font-size: 1rem; font-weight: 900;
    cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  }

  /* GRAMMAR TIP */
  .grammar-tip-card {
    margin: 6px 16px 10px; background: #FDEDE7; border: 2px solid var(--warn);
    border-radius: 16px; padding: 12px 14px; position: relative;
  }
  .grammar-tip-header { font-size: 0.82rem; font-weight: 900; color: var(--warn); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .grammar-tip-row { font-size: 0.95rem; margin-bottom: 3px; }
  .grammar-tip-before { color: #999; text-decoration: line-through; }
  .grammar-tip-after { color: var(--secondary); font-weight: 900; }
  .grammar-tip-explain { font-size: 0.82rem; color: var(--text-light); margin-top: 5px; font-weight: 600; }
  .grammar-tip-close {
    position: absolute; top: 8px; right: 10px; background: none; border: none;
    font-size: 1.1rem; cursor: pointer; color: var(--text-light);
  }

  /* STARTER SUGGESTIONS */
  .suggested-replies { padding: 6px 16px; display: flex; flex-direction: column; gap: 8px; }
  .suggested-label { font-size: 0.72rem; font-weight: 700; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
  .suggested-chip {
    background: white; border: 2px solid var(--border); border-radius: 14px;
    padding: 9px 13px; text-align: left; cursor: pointer; font-family: var(--font);
  }
  .suggested-chip:hover { border-color: var(--primary); background: #FFF1E0; }
  .suggested-chip-es { font-weight: 900; font-size: 0.92rem; }
  .suggested-chip-de { font-weight: 600; font-size: 0.78rem; color: var(--text-light); }

  /* ERROR */
  .error-banner {
    margin: 6px 16px 10px; background: #FDEDE7; border: 2px solid var(--warn);
    border-radius: 16px; padding: 12px 14px; font-size: 0.88rem; font-weight: 700; color: var(--warn);
  }

  .chat-input-row { display: flex; gap: 8px; padding: 12px 16px 16px; border-top: 2px solid var(--border); flex-shrink: 0; }
  .chat-input {
    flex: 1; border: 2px solid var(--border); border-radius: 14px; padding: 12px 14px;
    font-family: var(--font); font-size: 1rem; font-weight: 600; color: var(--text);
  }
  .chat-input:focus { outline: none; border-color: var(--primary); }
  .send-btn {
    background: var(--primary); color: white; border: none; border-radius: 14px;
    width: 52px; font-size: 1.3rem; cursor: pointer; flex-shrink: 0;
  }
  .send-btn:hover { background: var(--primary-dark); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .mic-btn {
    background: var(--secondary); color: white; border: none; border-radius: 14px;
    width: 52px; font-size: 1.3rem; cursor: pointer; flex-shrink: 0;
  }
  .mic-btn:hover { background: #228074; }
  .mic-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .mic-btn.listening { background: var(--primary); animation: mic-pulse 1.1s infinite; }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(214,40,40,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(214,40,40,0); }
  }
  .mic-hint { padding: 0 16px 10px; font-size: 0.78rem; color: var(--text-light); font-weight: 600; text-align: center; }
  .mic-hint.error { color: var(--warn); }
  .voice-toggle-btn { margin-left: auto; }

  /* VOCAB SCREEN */
  .vocab-list { display: flex; flex-direction: column; gap: 10px; }
  .vocab-item {
    background: white; border: 2px solid var(--border); border-radius: 16px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px;
  }
  .vocab-item.learned { background: #F5FBF8; border-color: var(--secondary); }
  .vocab-item-text { flex: 1; }
  .vocab-item-word { font-size: 1.05rem; font-weight: 900; color: var(--text); }
  .vocab-item-trans { font-size: 0.88rem; color: var(--text-light); font-weight: 600; }
  .vocab-star {
    background: none; border: 2px solid var(--border); border-radius: 50%;
    width: 38px; height: 38px; font-size: 1.1rem; cursor: pointer; flex-shrink: 0;
  }
  .vocab-item.learned .vocab-star { border-color: var(--secondary); background: #E9F6F4; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
  .empty-state .big-emoji { font-size: 3rem; margin-bottom: 10px; }
  .empty-state p { font-weight: 700; margin-bottom: 4px; }

  /* SUMMARY */
  .summary-hero { text-align: center; margin-bottom: 20px; }
  .summary-hero .big-emoji { font-size: 3.4rem; margin-bottom: 8px; }
  .summary-hero h2 { font-size: 1.5rem; font-weight: 900; }
  .summary-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 20px; }
  .summary-stat { background: #FFF1E0; border-radius: 14px; padding: 12px 6px; text-align: center; }
  .summary-stat .val { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
  .summary-stat .lbl { font-size: 0.68rem; font-weight: 700; color: var(--text-light); }
  .summary-block { margin-bottom: 18px; }
  .summary-block-title { font-size: 0.85rem; font-weight: 900; color: var(--secondary); margin-bottom: 8px; }
  .summary-vocab-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .summary-vocab-chip { background: #E9F6F4; border-radius: 12px; padding: 6px 12px; font-size: 0.85rem; font-weight: 700; color: var(--secondary); }
  .summary-tip-item { background: #FDEDE7; border-radius: 12px; padding: 10px 12px; font-size: 0.88rem; font-weight: 700; color: var(--warn); margin-bottom: 6px; }
  .summary-empty { font-size: 0.85rem; color: var(--text-light); font-weight: 600; }

  .sr-only {
    position: absolute; left: -9999px; top: auto;
    width: 1px; height: 1px; overflow: hidden;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Characters ──────────────────────────────────────────────────────────────
const CHARACTERS = [
  {
    id:"sofia", name:"Sofía", flag:"🇪🇸", avatar:"👩🏻‍🦰", country:"Madrid, España",
    level:"Anfänger (A1)", topic:"Alltag & Café", locale:"es-ES",
    persona:"Du bist herzlich und geduldig, redest gern über Alltag, Kaffee und das Leben in Madrid. Du benutzt sehr einfache, kurze Sätze, passend für absolute Anfänger.",
  },
  {
    id:"diego", name:"Diego", flag:"🇲🇽", avatar:"🧑🏽", country:"Ciudad de México",
    level:"Mittel (A2–B1)", topic:"Reisen & Essen", locale:"es-MX",
    persona:"Du bist locker und humorvoll, redest gern über Reisen, Essen und mexikanische Kultur. Du verwendest Sätze mittlerer Komplexität.",
  },
  {
    id:"valentina", name:"Valentina", flag:"🇦🇷", avatar:"👩🏽", country:"Buenos Aires, Argentina",
    level:"Mittel (B1)", topic:"Kultur & Musik", locale:"es-AR",
    persona:"Du bist lebhaft und leidenschaftlich für Musik und Tango, redest gern über Kultur in Buenos Aires. Du benutzt das argentinische 'vos' (z.B. 'tenés', 'escuchás') statt 'tú'.",
  },
  {
    id:"mateo", name:"Mateo", flag:"🇨🇴", avatar:"🧑🏻‍💼", country:"Bogotá, Colombia",
    level:"Fortgeschritten (B1–B2)", topic:"Beruf & Small Talk", locale:"es-CO",
    persona:"Du bist professionell und reflektiert, redest gern über Beruf und Karriere. Du sprichst in vollständigeren, etwas anspruchsvolleren Sätzen passend zum höheren Niveau.",
  },
  {
    id:"camila", name:"Camila", flag:"🇨🇱", avatar:"👩🏼‍🦱", country:"Chile",
    level:"Anfänger–Mittel (A2)", topic:"Reisen & Natur", locale:"es-CL",
    persona:"Du bist abenteuerlustig und naturverbunden, redest gern über Reisen, Wandern und die Natur Chiles. Du benutzt einfache bis mittlere Sätze.",
  },
];

// ── Starter suggestions (shown only before the learner's first message) ────
const STARTER_SUGGESTIONS = [
  { es:"Me llamo Alex y soy de Alemania.", de:"Ich heiße Alex und komme aus Deutschland." },
  { es:"¡Mucho gusto! Yo soy de Alemania.", de:"Sehr erfreut! Ich komme aus Deutschland." },
  { es:"Hola, ¿cómo estás?", de:"Hallo, wie geht es dir?" },
];

// ── Claude API ───────────────────────────────────────────────────────────────
const API_KEY_STORAGE = "boneBannerApiKey";
const MODEL = "claude-opus-5-5";

const CHARACTER_REPLY_TOOL = {
  name: "character_reply",
  description: "Antwort des Charakters im Spanisch-Lerngespräch, inklusive optionalem Grammatik-Feedback und Vokabel-Vorschlägen.",
  input_schema: {
    type: "object",
    properties: {
      reply_es: { type: "string", description: "Die Antwort des Charakters auf Spanisch, 1-3 kurze natürliche Sätze, passend zum Sprachniveau des Lernenden." },
      reply_de: { type: "string", description: "Natürliche deutsche Übersetzung von reply_es." },
      grammar_tip: {
        type: "object",
        description: "Rückmeldung zu einem klaren Grammatikfehler in der letzten Nachricht des Lernenden. Nur ausfüllen, wenn es einen eindeutigen Fehler gibt und es nicht die erste Nachricht im Gespräch ist; sonst dieses Feld komplett weglassen.",
        properties: {
          original: { type: "string", description: "Der fehlerhafte Ausdruck aus der Nachricht des Lernenden." },
          corrected: { type: "string", description: "Die korrigierte Version davon." },
          explanation_de: { type: "string", description: "Kurze, freundliche Erklärung auf Deutsch, warum." },
        },
        required: ["original", "corrected", "explanation_de"],
      },
      vocab_suggestions: {
        type: "array",
        description: "0 bis 3 nützliche spanische Wörter aus reply_es, die der Lernende vermutlich noch nicht kennt.",
        items: {
          type: "object",
          properties: {
            word: { type: "string" },
            translation_de: { type: "string" },
          },
          required: ["word", "translation_de"],
        },
      },
    },
    required: ["reply_es", "reply_de", "vocab_suggestions"],
  },
};

function buildSystemPrompt(character, knownWords) {
  return `Du bist ${character.name}, eine Person aus ${character.country}. ${character.persona}

Du führst ein Spanisch-Lerngespräch mit einer deutschsprachigen Person auf Niveau ${character.level} zum Thema "${character.topic}".

Regeln:
- Antworte IMMER ausschließlich über den Funktionsaufruf "character_reply", niemals als normaler Text.
- reply_es: 1-3 kurze, natürliche Sätze auf Spanisch, passend zum angegebenen Niveau. Bleib im Charakter und reagiere konkret auf das, was der Lernende zuletzt geschrieben hat. Stelle meistens am Ende eine Rückfrage, damit das Gespräch weitergeht.
- reply_de: eine natürliche deutsche Übersetzung von reply_es.
- Prüfe die letzte Nachricht des Lernenden auf einen klaren Grammatikfehler (z.B. Verbkonjugation, ser/estar, Artikel-Genus, fehlende Akzente, falsche Präposition, Wortstellung). Wenn du einen eindeutigen Fehler findest, fülle grammar_tip aus. Gibt es keinen Fehler oder ist dies die erste Nachricht im Gespräch, lass grammar_tip komplett weg.
- Schlage 0 bis 3 spanische Wörter aus deiner eigenen reply_es als vocab_suggestions vor, die für das Niveau ${character.level} lehrreich sind. Diese Wörter kennt der Lernende schon, schlage sie nicht erneut vor: ${knownWords.length ? knownWords.join(", ") : "(noch keine)"}.
- Sei freundlich, geduldig und ermutigend.`;
}

async function callClaude(apiKey, systemPrompt, apiHistory) {
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2026-10-21",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1024,
        output_config: { effort: "low" },
        system: systemPrompt,
        tools: [CHARACTER_REPLY_TOOL],
        tool_choice: { type: "auto" },
        messages: apiHistory,
      }),
    });
  } catch (e) {
    throw new Error("Netzwerkfehler. Bist du online?");
  }

  if (!res.ok) {
    let msg = "Fehler beim Abruf (HTTP " + res.status + ")";
    try {
      const data = await res.json();
      if (data && data.error && data.error.message) msg = data.error.message;
    } catch (e) {}
    if (res.status === 401) msg = "Ungültiger API-Key. Bitte prüfen.";
    else if (res.status === 429) msg = "Zu viele Anfragen gerade. Versuch's gleich nochmal.";
    else if (res.status >= 500) msg = "Claude-Server-Fehler. Versuch's nochmal.";
    throw new Error(msg);
  }

  const data = await res.json();
  const toolUse = (data.content || []).find(b => b.type === "tool_use" && b.name === "character_reply");
  if (toolUse) return { parsed: toolUse.input, assistantContent: data.content };

  const textBlock = (data.content || []).find(b => b.type === "text");
  return {
    parsed: { reply_es: textBlock ? textBlock.text : "...", reply_de: "", vocab_suggestions: [] },
    assistantContent: data.content,
  };
}

const DAILY_GOAL = 30;
const PROFILE_KEY = "boneBannerProfile";

function todayStr() { return new Date().toISOString().slice(0, 10); }

function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { streak: 0, lastActiveDate: null, xp: 0, dailyXP: 0, dailyDate: todayStr(), vocab: {} };
}

function ensureDaily(profile) {
  const today = todayStr();
  if (profile.dailyDate !== today) profile.dailyDate = today, profile.dailyXP = 0;
  if (profile.lastActiveDate === today) return profile;
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  profile.streak = profile.lastActiveDate === yesterday ? profile.streak + 1 : 1;
  profile.lastActiveDate = today;
  return profile;
}

let idCounter = 0;
function nextId() { idCounter += 1; return idCounter; }

// ── Voice (Web Speech API) ──────────────────────────────────────────────────
const SPEECH_RECOGNITION = typeof window !== "undefined" ? (window.SpeechRecognition || window.webkitSpeechRecognition) : null;

// ── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [profile, setProfile] = useState(loadProfile);
  const [apiKey, setApiKey] = useState(() => { try { return localStorage.getItem(API_KEY_STORAGE) || ""; } catch (e) { return ""; } });
  const [apiKeyInput, setApiKeyInput] = useState("");
  const [screen, setScreen] = useState("home");
  const [character, setCharacter] = useState(null);
  const [messages, setMessages] = useState([]);
  const [apiHistory, setApiHistory] = useState([]);
  const [isTyping, setIsTyping] = useState(false);
  const [input, setInput] = useState("");
  const [currentTip, setCurrentTip] = useState(null);
  const [vocabSuggestions, setVocabSuggestions] = useState([]);
  const [revealed, setRevealed] = useState(() => new Set());
  const [sessionXP, setSessionXP] = useState(0);
  const [sessionNewVocab, setSessionNewVocab] = useState([]);
  const [sessionTips, setSessionTips] = useState([]);
  const [apiError, setApiError] = useState("");
  const [voiceOn, setVoiceOn] = useState(true);
  const [isListening, setIsListening] = useState(false);
  const [micError, setMicError] = useState("");
  const chatWindowRef = useRef(null);
  const recognitionRef = useRef(null);
  const finalTranscriptRef = useRef("");

  useEffect(() => {
    try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (e) {}
  }, [profile]);

  useEffect(() => () => {
    if (recognitionRef.current) recognitionRef.current.stop();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  }, []);

  useEffect(() => {
    if (chatWindowRef.current) chatWindowRef.current.scrollTop = chatWindowRef.current.scrollHeight;
  }, [messages, isTyping, vocabSuggestions, currentTip, apiError]);

  function addXP(amount) {
    setProfile(prev => ({ ...prev, xp: prev.xp + amount, dailyXP: prev.dailyXP + amount }));
    setSessionXP(v => v + amount);
  }

  function saveApiKey() {
    const trimmed = apiKeyInput.trim();
    if (!trimmed) return;
    try { localStorage.setItem(API_KEY_STORAGE, trimmed); } catch (e) {}
    setApiKey(trimmed);
    setApiKeyInput("");
    setScreen("home");
  }

  function removeApiKey() {
    try { localStorage.removeItem(API_KEY_STORAGE); } catch (e) {}
    setApiKey("");
  }

  function speak(text, lang) {
    if (!voiceOn || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const clean = text.replace(/[¿¡]/g, "");
    const utt = new SpeechSynthesisUtterance(clean);
    utt.lang = lang || "es-ES";
    utt.rate = 0.92;
    window.speechSynthesis.speak(utt);
  }

  async function openCharacter(ch) {
    if (!apiKey) { setScreen("apikey"); return; }
    setCharacter(ch);
    setMessages([]);
    setInput("");
    setCurrentTip(null);
    setVocabSuggestions([]);
    setRevealed(new Set());
    setSessionXP(0);
    setSessionNewVocab([]);
    setSessionTips([]);
    setMicError("");
    setApiError("");
    setScreen("chat");
    setIsTyping(true);

    const knownWords = Object.keys(profile.vocab);
    const sys = buildSystemPrompt(ch, knownWords);
    const history = [{ role: "user", content: "[Das Gespräch beginnt jetzt. Begrüße mich auf Spanisch, stell dich kurz vor und stelle eine erste Frage.]" }];
    try {
      const { parsed, assistantContent } = await callClaude(apiKey, sys, history);
      setApiHistory([...history, { role: "assistant", content: assistantContent }]);
      setMessages([{ id: nextId(), sender: "ai", es: parsed.reply_es, de: parsed.reply_de }]);
      setTimeout(() => speak(parsed.reply_es, ch.locale), 300);
    } catch (err) {
      setApiError(err.message);
    } finally {
      setIsTyping(false);
    }
  }

  function goHome() {
    if (recognitionRef.current) recognitionRef.current.stop();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    setScreen("home");
    setCharacter(null);
  }

  function startListening() {
    if (!SPEECH_RECOGNITION || isTyping) return;
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    setMicError("");
    const recog = new SPEECH_RECOGNITION();
    recog.lang = character.locale || "es-ES";
    recog.interimResults = true;
    recog.continuous = false;
    finalTranscriptRef.current = "";
    recog.onresult = (e) => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalTranscriptRef.current += t;
        else interim += t;
      }
      setInput((finalTranscriptRef.current + interim).trim());
    };
    recog.onerror = (e) => {
      setIsListening(false);
      setMicError(e.error === "not-allowed" ? "Mikrofon-Zugriff wurde blockiert." : "Spracherkennung hat nicht geklappt. Versuch's nochmal.");
    };
    recog.onend = () => {
      setIsListening(false);
      const text = finalTranscriptRef.current.trim();
      if (text) sendMessage(text);
    };
    recognitionRef.current = recog;
    setIsListening(true);
    recog.start();
  }

  function stopListening() {
    if (recognitionRef.current) recognitionRef.current.stop();
  }

  function toggleTranslation(id) {
    setRevealed(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  function saveVocab(word, translation) {
    const key = word.toLowerCase();
    if (profile.vocab[key]) return;
    setProfile(prev => ({ ...prev, vocab: { ...prev.vocab, [key]: { word, translation, savedAt: Date.now(), learned: false } } }));
    setVocabSuggestions(prev => prev.filter(v => v.word !== word));
    setSessionNewVocab(prev => [...prev, { word, translation }]);
    addXP(5);
  }

  function toggleLearned(key) {
    setProfile(prev => ({ ...prev, vocab: { ...prev.vocab, [key]: { ...prev.vocab[key], learned: !prev.vocab[key].learned } } }));
  }

  async function sendMessage(text) {
    const trimmed = text.trim();
    if (!trimmed || isTyping) return;

    setProfile(prev => ensureDaily({ ...prev }));
    setMessages(prev => [...prev, { id: nextId(), sender: "user", text: trimmed }]);
    setInput("");
    setVocabSuggestions([]);
    setCurrentTip(null);
    setApiError("");
    addXP(8);
    setIsTyping(true);

    const knownWords = Object.keys(profile.vocab);
    const sys = buildSystemPrompt(character, knownWords);
    const newHistory = [...apiHistory, { role: "user", content: trimmed }];

    try {
      const { parsed, assistantContent } = await callClaude(apiKey, sys, newHistory);
      setApiHistory([...newHistory, { role: "assistant", content: assistantContent }]);

      if (parsed.grammar_tip) {
        const tip = { before: parsed.grammar_tip.original, after: parsed.grammar_tip.corrected, explain: parsed.grammar_tip.explanation_de };
        setCurrentTip(tip);
        setSessionTips(prev => [...prev, tip]);
      }
      setMessages(prev => {
        const updated = [...prev];
        if (parsed.grammar_tip) {
          for (let i = updated.length - 1; i >= 0; i--) {
            if (updated[i].sender === "user") { updated[i] = { ...updated[i], hasTip: true }; break; }
          }
        }
        return [...updated, { id: nextId(), sender: "ai", es: parsed.reply_es, de: parsed.reply_de }];
      });

      const newWords = (parsed.vocab_suggestions || []).filter(v => v.word && !profile.vocab[v.word.toLowerCase()])
        .map(v => ({ word: v.word, translation: v.translation_de }));
      setVocabSuggestions(newWords);
      speak(parsed.reply_es, character.locale);
    } catch (err) {
      setApiError(err.message);
    } finally {
      setIsTyping(false);
    }
  }

  function finishConversation() {
    if (userMsgCount > 0) addXP(10);
    goHome();
    setScreen("summary");
  }

  const userMsgCount = messages.filter(m => m.sender === "user").length;
  const vocabEntries = Object.entries(profile.vocab).sort((a, b) => b[1].savedAt - a[1].savedAt);
  const goalPct = Math.min(100, Math.round((profile.dailyXP / DAILY_GOAL) * 100));

  return (
    <div className="app" role="main">
      <a href="#main-content" className="sr-only">Zum Hauptinhalt springen</a>

      {screen === "home" && (
        <React.Fragment>
          <div className="header">
            <h1>Bone Banner 🇪🇸</h1>
            <div className="subtitle">Sprich Spanisch mit KI-Charakteren</div>
          </div>
          <main id="main-content" className="main">
            {!apiKey && (
              <div className="setup-banner">
                🔑 Du brauchst einen Anthropic API-Key, damit die Charaktere wirklich mit dir reden.{" "}
                <button className="link-btn" onClick={() => setScreen("apikey")}>Jetzt einrichten</button>
              </div>
            )}
            <div className="stats-row">
              <div className="stat-badge"><div className="stat-emoji">🔥</div><div className="stat-value">{profile.streak}</div><div className="stat-label">Tage Streak</div></div>
              <div className="stat-badge"><div className="stat-emoji">⭐</div><div className="stat-value">{profile.xp}</div><div className="stat-label">XP</div></div>
              <div className="stat-badge"><div className="stat-emoji">📚</div><div className="stat-value">{vocabEntries.length}</div><div className="stat-label">Vokabeln</div></div>
            </div>
            <div className="daily-goal">
              <div className="daily-goal-label"><span>Tagesziel</span><span>{Math.min(profile.dailyXP, DAILY_GOAL)} / {DAILY_GOAL} XP</span></div>
              <div className="daily-goal-bar"><div className="daily-goal-fill" style={{ width: goalPct + "%" }} /></div>
            </div>

            <div className="section-label">Wähle deinen Gesprächspartner</div>
            <div className="character-grid" role="group" aria-label="Charakter auswählen">
              {CHARACTERS.map(ch => (
                <button key={ch.id} className="character-card" onClick={() => openCharacter(ch)}>
                  <span className="character-avatar-wrap">
                    <span className="character-avatar">{ch.avatar}</span>
                    <span className="character-flag">{ch.flag}</span>
                  </span>
                  <span>
                    <div className="character-name">{ch.name}</div>
                    <div className="character-topic">{ch.country} · {ch.topic}</div>
                    <span className="character-level">{ch.level}</span>
                  </span>
                </button>
              ))}
            </div>

            <button className="btn btn-secondary btn-block" onClick={() => setScreen("vocab")}>
              📖 Mein Wortschatz üben
            </button>
            <button className="btn btn-outline btn-block" onClick={() => setScreen("apikey")}>
              ⚙️ API-Key verwalten
            </button>
          </main>
        </React.Fragment>
      )}

      {screen === "apikey" && (
        <React.Fragment>
          <div className="chat-header">
            <button className="back-btn" onClick={() => setScreen("home")} aria-label="Zurück">←</button>
            <span className="chat-header-name">🔑 Anthropic API-Key</span>
          </div>
          <main className="main">
            {apiKey && <div className="apikey-saved">✅ Ein API-Key ist gespeichert.</div>}
            <p className="apikey-help">
              Bone Banner ruft Claude direkt aus deinem Browser auf. Dafür brauchst du einen eigenen
              API-Key von <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">console.anthropic.com</a>.
              Der Key wird nur lokal in diesem Browser gespeichert (localStorage) und sonst nirgendwo hochgeladen.
              Jede Nachricht kostet nur einen kleinen Bruchteil eines Cents.
            </p>
            <input
              type="password"
              className="apikey-input"
              placeholder="sk-ant-..."
              value={apiKeyInput}
              onChange={e => setApiKeyInput(e.target.value)}
              aria-label="Anthropic API-Key"
            />
            <button className="btn btn-primary btn-block" onClick={saveApiKey} disabled={!apiKeyInput.trim()}>
              Speichern
            </button>
            {apiKey && (
              <button className="btn btn-danger-outline btn-block" onClick={removeApiKey}>
                API-Key entfernen
              </button>
            )}
          </main>
        </React.Fragment>
      )}

      {screen === "chat" && character && (
        <React.Fragment>
          <div className="chat-header">
            <button className="back-btn" onClick={goHome} aria-label="Zurück">←</button>
            <span className="chat-header-avatar">{character.avatar}</span>
            <span>
              <div className="chat-header-name">{character.name} {character.flag}</div>
              <div className="chat-header-meta">{character.level} · {character.topic}</div>
            </span>
            <button className="back-btn voice-toggle-btn" onClick={() => setVoiceOn(v => !v)}
              aria-label={voiceOn ? "Stimme ausschalten" : "Stimme einschalten"} title={voiceOn ? "Stimme ausschalten" : "Stimme einschalten"}>
              {voiceOn ? "🔊" : "🔇"}
            </button>
          </div>

          <div className="chat-window" ref={chatWindowRef}>
            {messages.map(m => m.sender === "ai" ? (
              <div key={m.id} className="msg-row ai">
                <span className="msg-avatar">{character.avatar}</span>
                <div>
                  <div className="msg-bubble" onClick={() => toggleTranslation(m.id)} role="button" tabIndex={0}>
                    {m.es}
                    {revealed.has(m.id) && <div className="msg-translation">{m.de}</div>}
                  </div>
                  {!revealed.has(m.id) && <div className="msg-hint">👆 Zum Übersetzen antippen</div>}
                </div>
              </div>
            ) : (
              <div key={m.id} className="msg-row user">
                <div>
                  <div className="msg-bubble">{m.text}</div>
                  {m.hasTip && <div className="msg-tip-flag">💡 Grammatik-Tipp verfügbar</div>}
                </div>
              </div>
            ))}
            {isTyping && (
              <div className="msg-row ai">
                <span className="msg-avatar">{character.avatar}</span>
                <div className="msg-bubble typing-bubble"><span className="typing-dot" /><span className="typing-dot" /><span className="typing-dot" /></div>
              </div>
            )}
          </div>

          {vocabSuggestions.length > 0 && !isTyping && (
            <div className="vocab-suggestions">
              {vocabSuggestions.map(v => (
                <div key={v.word} className="vocab-chip">
                  <span className="vocab-chip-text"><span className="vocab-chip-word">{v.word}</span> <span className="vocab-chip-trans">– {v.translation}</span></span>
                  <button className="vocab-chip-add" onClick={() => saveVocab(v.word, v.translation)} aria-label={"Vokabel " + v.word + " speichern"}>+</button>
                </div>
              ))}
            </div>
          )}

          {currentTip && (
            <div className="grammar-tip-card">
              <button className="grammar-tip-close" onClick={() => setCurrentTip(null)} aria-label="Tipp schließen">×</button>
              <div className="grammar-tip-header">💡 Grammatik-Tipp</div>
              <div className="grammar-tip-row"><span className="grammar-tip-before">{currentTip.before}</span> → <span className="grammar-tip-after">{currentTip.after}</span></div>
              <div className="grammar-tip-explain">{currentTip.explain}</div>
            </div>
          )}

          {apiError && <div className="error-banner">⚠️ {apiError}</div>}

          {!isTyping && userMsgCount === 0 && !apiError && (
            <div className="suggested-replies">
              <div className="suggested-label">Vorschläge</div>
              {STARTER_SUGGESTIONS.map((r, i) => (
                <button key={i} className="suggested-chip" onClick={() => sendMessage(r.es)}>
                  <div className="suggested-chip-es">{r.es}</div>
                  <div className="suggested-chip-de">{r.de}</div>
                </button>
              ))}
            </div>
          )}

          <form className="chat-input-row" onSubmit={e => { e.preventDefault(); sendMessage(input); }}>
            {SPEECH_RECOGNITION && (
              <button type="button" className={"mic-btn" + (isListening ? " listening" : "")}
                onClick={() => (isListening ? stopListening() : startListening())}
                disabled={isTyping} aria-label={isListening ? "Aufnahme stoppen" : "Auf Spanisch sprechen"}
                title={isListening ? "Aufnahme stoppen" : "Auf Spanisch sprechen"}>
                {isListening ? "⏹️" : "🎙️"}
              </button>
            )}
            <input className="chat-input" value={input} onChange={e => setInput(e.target.value)}
              placeholder={isListening ? "Ich höre zu..." : "Sprich oder schreib auf Spanisch..."}
              disabled={isTyping} aria-label="Nachricht auf Spanisch" />
            <button type="submit" className="send-btn" disabled={isTyping || !input.trim()} aria-label="Senden">➤</button>
          </form>
          {!SPEECH_RECOGNITION && (
            <div className="mic-hint">🎙️ Spracherkennung wird von diesem Browser nicht unterstützt (am besten Chrome oder Edge nutzen).</div>
          )}
          {micError && <div className="mic-hint error">⚠️ {micError}</div>}
          <button className="btn btn-outline" style={{ margin: "0 16px 16px", width: "calc(100% - 32px)" }} onClick={finishConversation}>
            Gespräch beenden
          </button>
        </React.Fragment>
      )}

      {screen === "vocab" && (
        <React.Fragment>
          <div className="chat-header">
            <button className="back-btn" onClick={goHome} aria-label="Zurück">←</button>
            <span className="chat-header-name">📖 Mein Wortschatz</span>
          </div>
          <main className="main">
            {vocabEntries.length === 0 ? (
              <div className="empty-state">
                <div className="big-emoji">📚</div>
                <p>Noch keine Vokabeln gespeichert.</p>
                <p>Chatte mit einem Charakter, um neue Wörter zu sammeln!</p>
              </div>
            ) : (
              <div className="vocab-list">
                {vocabEntries.map(([key, data]) => (
                  <div key={key} className={"vocab-item" + (data.learned ? " learned" : "")}>
                    <div className="vocab-item-text">
                      <div className="vocab-item-word">{data.word}</div>
                      <div className="vocab-item-trans">{data.translation}</div>
                    </div>
                    <button className="vocab-star" onClick={() => toggleLearned(key)} aria-label={data.learned ? "Als nicht gelernt markieren" : "Als gelernt markieren"}>
                      {data.learned ? "⭐" : "☆"}
                    </button>
                  </div>
                ))}
              </div>
            )}
          </main>
        </React.Fragment>
      )}

      {screen === "summary" && (
        <React.Fragment>
          <div className="header">
            <h1>Bone Banner 🇪🇸</h1>
          </div>
          <main className="main">
            <div className="summary-hero">
              <div className="big-emoji">🎉</div>
              <h2>Super gemacht!</h2>
            </div>
            <div className="summary-stats">
              <div className="summary-stat"><div className="val">{userMsgCount}</div><div className="lbl">Nachrichten</div></div>
              <div className="summary-stat"><div className="val">{sessionNewVocab.length}</div><div className="lbl">Neue Vokabeln</div></div>
              <div className="summary-stat"><div className="val">+{sessionXP}</div><div className="lbl">XP verdient</div></div>
            </div>
            <div className="summary-block">
              <div className="summary-block-title">📚 Neue Vokabeln</div>
              {sessionNewVocab.length === 0 ? <div className="summary-empty">Keine neuen Vokabeln in dieser Sitzung gespeichert.</div> : (
                <div className="summary-vocab-list">
                  {sessionNewVocab.map((v, i) => <span key={i} className="summary-vocab-chip">{v.word} – {v.translation}</span>)}
                </div>
              )}
            </div>
            <div className="summary-block">
              <div className="summary-block-title">💡 Grammatik-Tipps</div>
              {sessionTips.length === 0 ? <div className="summary-empty">Keine Grammatik-Tipps in dieser Sitzung.</div> : (
                sessionTips.map((t, i) => <div key={i} className="summary-tip-item">{t.before} → {t.after}</div>)
              )}
            </div>
            <button className="btn btn-primary" onClick={goHome}>Fertig ✓</button>
          </main>
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
